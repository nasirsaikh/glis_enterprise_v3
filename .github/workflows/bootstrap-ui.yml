name: Bootstrap UI validation

on:
  push:
    branches: [main, "codex/**"]
    paths: ["static/**", "templates/**", "apps/**", "services/**", "scripts/**", ".github/workflows/bootstrap-ui.yml"]
  pull_request:
    paths: ["static/**", "templates/**", "apps/**", "services/**", "scripts/**", ".github/workflows/bootstrap-ui.yml"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate Bootstrap assets and Python syntax
        run: |
          python scripts/check_bootstrap_assets.py
          python -m compileall -q glis apps services
      - name: Validate JavaScript syntax
        run: |
          for source in static/js/*.js; do node --check "$source"; done
      - name: Install browser regression runtime
        run: |
          npm install --prefix /tmp/glis-ui-tests --no-package-lock --no-save playwright@1.55.1
          node /tmp/glis-ui-tests/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test compact layouts and Bootstrap interactions
        run: NODE_PATH=/tmp/glis-ui-tests/node_modules node --test scripts/test_portal_ui.cjs
