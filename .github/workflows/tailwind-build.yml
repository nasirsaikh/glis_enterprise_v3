name: Django UI validation

on:
  push:
    branches:
      - main
      - django-cdn-tailwind-daisyui
    paths:
      - "static/css/glis-tailwind.css"
      - "static/js/app.js"
      - "templates/**"
      - "apps/**"
      - "services/**"
      - ".github/workflows/tailwind-build.yml"
  pull_request:
    paths:
      - "static/css/glis-tailwind.css"
      - "static/js/app.js"
      - "templates/**"
      - "apps/**"
      - "services/**"
      - ".github/workflows/tailwind-build.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify Django-only UI assets
        run: |
          test ! -f package.json
          test ! -f package-lock.json
          test ! -f static/src/tailwind.css
          test -s static/css/glis-tailwind.css
          grep -Fq "tailwindcss v4.3.3" static/css/glis-tailwind.css
          grep -Fq "tw\\:d-btn" static/css/glis-tailwind.css
          grep -Fq "tw\\:d-aura" static/css/glis-tailwind.css
          grep -Fq "tw\\:d-hover-3d" static/css/glis-tailwind.css
          grep -Fq "tw\\:d-text-rotate" static/css/glis-tailwind.css
          grep -Fq "{% static 'css/glis-tailwind.css' %}" templates/base_public.html
          grep -Fq "{% static 'css/glis-tailwind.css' %}" templates/base_portal.html

      - name: Validate prefixed Tailwind syntax
        shell: python
        run: |
          from pathlib import Path
          import re

          files = (
              list(Path("templates").rglob("*.html"))
              + list(Path("apps").rglob("*.py"))
              + list(Path("services").rglob("*.py"))
          )
          invalid = []
          wrong_order = re.compile(r"\b(?:sm|md|lg|xl|2xl|hover|focus|active|disabled|group-hover|group-focus):tw:")
          mangled = re.compile(r"\b(?:2tw:|group-tw:)")

          for path in files:
              text = path.read_text(encoding="utf-8")
              for match in wrong_order.finditer(text):
                  invalid.append(f"{path}: {match.group(0)}")
              for match in mangled.finditer(text):
                  invalid.append(f"{path}: {match.group(0)}")

          if invalid:
              raise SystemExit("Invalid prefixed Tailwind syntax:\n" + "\n".join(invalid))

      - name: Validate Python syntax
        run: python -m compileall -q apps services
