{% load menu_tags i18n %}
<nav class="w-full" aria-label="{% translate 'Main navigation' %}">
  <ul class="flex items-center gap-1 p-0 text-sm font-semibold">
    {% for child in children %}
      {% if child.children %}
      <li>
        <details class="glis-nav-dropdown dropdown">
          <summary class="glis-nav-trigger btn btn-ghost btn-sm rounded-full gap-2 {% if child.selected or child.ancestor %}text-primary bg-base-200/60{% endif %}">
            <span>{{ child.get_menu_title }}</span>
            <i class="glis-nav-chevron bi bi-chevron-down text-[.65rem]"></i>
          </summary>
          <div class="glis-nav-panel dropdown-content z-[90] mt-2 w-[min(32rem,95vw)] rounded-2xl bg-base-100 p-4 shadow-2xl border border-base-200">
            <div class="grid grid-cols-2 gap-2">
              {% for subchild in child.children %}
              <a href="{{ subchild.get_absolute_url }}" class="flex flex-col gap-1 p-3 rounded-xl border border-base-200 bg-base-100 hover:border-primary hover:bg-primary/5 transition-all {% if subchild.selected %}border-primary bg-primary/10{% endif %}">
                <div class="flex items-center justify-between">
                  <span class="grid h-8 w-8 place-items-center rounded-lg bg-primary/10 text-primary">
                    <i class="bi bi-grid-fill text-xs"></i>
                  </span>
                  <i class="bi bi-arrow-{% if LANGUAGE_CODE == 'ar' %}left{% else %}right{% endif %} text-xs text-base-content/40"></i>
                </div>
                <span class="text-xs font-bold text-base-content mt-1">{{ subchild.get_menu_title }}</span>
              </a>
              {% endfor %}
            </div>
          </div>
        </details>
      </li>
      {% else %}
      <li>
        <a href="{{ child.get_absolute_url }}" class="btn btn-ghost btn-sm rounded-full {% if child.selected %}text-primary bg-base-200/60{% endif %}">
          {{ child.get_menu_title }}
        </a>
      </li>
      {% endif %}
    {% endfor %}
  </ul>
</nav>
