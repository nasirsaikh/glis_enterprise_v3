{% load sekizai_tags %}
{% if instance.is_active %}
    {{ instance.html_content|safe }}
    {% if instance.css_content %}
        {% addtoblock "css" %}
            <style>
                {{ instance.css_content|safe }}
            </style>
        {% endaddtoblock %}
    {% endif %}
    {% if instance.javascript_content %}
        {% addtoblock "js" %}
            <script>
                {{ instance.javascript_content|safe }}
            </script>
        {% endaddtoblock %}
    {% endif %}
{% endif %}
