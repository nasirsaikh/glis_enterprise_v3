<div class="card border-0 shadow-lg rounded-4"><div class="card-body p-4 p-lg-5 text-center">{% if instance.eyebrow %}<span class="page-eyebrow">{{ instance.eyebrow }}</span>{% endif %}<h2 class="display-6 fw-bold mt-2">{{ instance.title }}</h2>{% if instance.content %}<p class="lead">{{ instance.content }}</p>{% endif %}{% if instance.button_text %}<a href="{{ instance.button_url|default:'#' }}" class="btn btn-primary btn-lg mt-2">{{ instance.button_text }}</a>{% endif %}</div></div>
