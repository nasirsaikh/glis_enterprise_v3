{% load i18n %}
<nav class="card border border-base-300 bg-base-100" aria-label="{% translate 'Step navigation' %}">
  <div class="card-body flex-row flex-wrap items-center justify-between gap-3 p-3">
    {% if previous_step %}
    <a class="btn btn-ghost" href="{{ previous_step.url }}" hx-get="{{ previous_step.url }}" hx-push-url="true" data-workflow-navigation><i class="bi bi-arrow-left" aria-hidden="true"></i>{% translate "Previous" %}</a>
    {% else %}<button class="btn btn-ghost" type="button" disabled><i class="bi bi-arrow-left" aria-hidden="true"></i>{% translate "Previous" %}</button>{% endif %}
    <span class="text-xs opacity-60">{{ step_number }} / {{ workflow_steps|length }} · {{ active_step.label }}</span>
    {% if next_step and next_step.accessible %}
    <a class="btn btn-outline" href="{{ next_step.url }}" hx-get="{{ next_step.url }}" hx-push-url="true" data-workflow-navigation>{% translate "Next" %}<i class="bi bi-arrow-right" aria-hidden="true"></i></a>
    {% elif next_step %}<button class="btn btn-outline" type="button" disabled title="{% translate 'Complete the required workflow action to unlock this step.' %}">{% translate "Next" %}<i class="bi bi-lock" aria-hidden="true"></i></button>
    {% else %}<span class="badge badge-outline">{{ tx.get_status_display }}</span>{% endif %}
  </div>
</nav>
