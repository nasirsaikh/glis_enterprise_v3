{% load i18n %}
<div id="assignment-fields" class="glis-stack-3">
<label class="glis-field"><span class="form-label">{% translate 'Organization' %}</span><select name="organization" class="form-select w-100" hx-get="{% url 'portal:assignment_options' ticket.reference %}" hx-include="this" hx-target="#assignment-fields" hx-swap="outerHTML" hx-indicator="#assignment-loading"><option value="">{% translate 'All authorized organizations' %}</option>{% for value,label in assignment_form.organization.field.choices %}{% if value %}<option value="{{ value }}" {% if assignment_form.organization.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></label>
<label class="glis-field"><span class="form-label">{% translate 'Support Group' %}</span><select name="support_group" class="form-select w-100" hx-get="{% url 'portal:assignment_options' ticket.reference %}" hx-include="closest form" hx-target="#assignment-fields" hx-swap="outerHTML" hx-indicator="#assignment-loading"><option value="">{% translate 'All authorized groups' %}</option>{% for value,label in assignment_form.support_group.field.choices %}{% if value %}<option value="{{ value }}" {% if assignment_form.support_group.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></label>
<fieldset class="glis-field"><legend class="form-label">{% translate 'Users' %}</legend>{{ assignment_form.users }}</fieldset>
<fieldset class="glis-field"><legend class="form-label">{% translate 'Groups' %}</legend>{{ assignment_form.groups }}</fieldset>
<div id="assignment-loading" class="htmx-indicator"><span class="spinner-border spinner-border-sm"></span></div>
</div>
