{% load i18n %}
<div id="assignment-fields" class="space-y-3">
<label class="fieldset"><span class="fieldset-legend">{% translate 'Organization' %}</span><select name="organization" class="select select-bordered w-full" hx-get="{% url 'portal:assignment_options' ticket.reference %}" hx-include="this" hx-target="#assignment-fields" hx-swap="outerHTML" hx-indicator="#assignment-loading"><option value="">{% translate 'All authorized organizations' %}</option>{% for value,label in assignment_form.organization.field.choices %}{% if value %}<option value="{{ value }}" {% if assignment_form.organization.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></label>
<label class="fieldset"><span class="fieldset-legend">{% translate 'Support Group' %}</span><select name="support_group" class="select select-bordered w-full" hx-get="{% url 'portal:assignment_options' ticket.reference %}" hx-include="closest form" hx-target="#assignment-fields" hx-swap="outerHTML" hx-indicator="#assignment-loading"><option value="">{% translate 'All authorized groups' %}</option>{% for value,label in assignment_form.support_group.field.choices %}{% if value %}<option value="{{ value }}" {% if assignment_form.support_group.value|stringformat:'s' == value|stringformat:'s' %}selected{% endif %}>{{ label }}</option>{% endif %}{% endfor %}</select></label>
<label class="fieldset"><span class="fieldset-legend">{% translate 'Users' %}</span>{{ assignment_form.users }}</label>
<label class="fieldset"><span class="fieldset-legend">{% translate 'Groups' %}</span>{{ assignment_form.groups }}</label>
<div id="assignment-loading" class="htmx-indicator"><span class="loading loading-spinner loading-sm"></span></div>
</div>
