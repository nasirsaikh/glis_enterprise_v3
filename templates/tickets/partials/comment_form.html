{% load i18n %}<form class="comment-form" method="post" hx-post="{% url 'portal:add_comment' ticket.reference %}" hx-target="#comment-list" hx-swap="beforeend" data-reset-on-success="true">{% csrf_token %}<div class="mb-3">{{ comment_form.body }}{% if comment_form.body.errors %}<div class="invalid-feedback d-block">{{ comment_form.body.errors }}</div>{% endif %}</div><div class="d-flex flex-wrap justify-content-between align-items-center gap-3"><label class="form-check form-switch mb-0">{{ comment_form.is_internal }}<span class="form-check-label">{% translate "Internal note" %}</span></label><button class="btn btn-primary" type="submit"><i class="bi bi-send me-2"></i>{% translate "Post update" %}</button></div></form>
