{% load i18n %}
{% if can_share %}
<dialog id="tagModal" class="modal"><div class="modal-box"><h3 class="font-bold">{% translate 'Tag Users' %}</h3><form method="post" action="{% url 'portal:tag_ticket_user' ticket.reference %}" class="space-y-3" hx-post="{% url 'portal:tag_ticket_user' ticket.reference %}" hx-swap="none" hx-indicator="find .htmx-indicator" data-ticket-action>{% csrf_token %}{{ participant_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Tag' %}</button><span class="htmx-indicator loading loading-spinner loading-xs" aria-hidden="true"></span><div class="alert alert-error hidden mt-2" data-ticket-action-error role="alert"></div></form><div class="modal-action"><button type="button" class="btn btn-sm" onclick="document.getElementById('tagModal').close()">{% translate 'Close' %}</button></div></div></dialog>
<dialog id="approvalRequestModal" class="modal"><div class="modal-box"><h3 class="font-bold">{% translate 'Request Approval' %}</h3><form method="post" action="{% url 'portal:request_ticket_approval' ticket.reference %}" class="space-y-3" hx-post="{% url 'portal:request_ticket_approval' ticket.reference %}" hx-swap="none" hx-indicator="find .htmx-indicator" data-ticket-action>{% csrf_token %}{{ approval_request_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Request Approval' %}</button><span class="htmx-indicator loading loading-spinner loading-xs" aria-hidden="true"></span><div class="alert alert-error hidden mt-2" data-ticket-action-error role="alert"></div></form><div class="modal-action"><button type="button" class="btn btn-sm" onclick="document.getElementById('approvalRequestModal').close()">{% translate 'Close' %}</button></div></div></dialog>
{% endif %}
