{% load i18n %}
{% if can_share %}
<div tabindex="-1" aria-hidden="true" id="tagModal" class="modal fade"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable "><div class="modal-content"><div class="modal-body"><h3 class="fw-bold">{% translate 'Tag Users' %}</h3><form method="post" action="{% url 'portal:tag_ticket_user' ticket.reference %}" class="glis-stack-3" hx-post="{% url 'portal:tag_ticket_user' ticket.reference %}" hx-swap="none" hx-indicator="find .htmx-indicator" data-ticket-action>{% csrf_token %}{{ participant_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Tag' %}</button><span class="htmx-indicator spinner-border spinner-border-sm" aria-hidden="true"></span><div class="alert alert-danger d-none mt-2" data-ticket-action-error role="alert"></div></form><div class="modal-footer"><button type="button" class="btn btn-sm" data-bs-dismiss="modal">{% translate 'Close' %}</button></div></div></div></div></div>
<div tabindex="-1" aria-hidden="true" id="approvalRequestModal" class="modal fade"><div class="modal-dialog modal-dialog-centered modal-dialog-scrollable "><div class="modal-content"><div class="modal-body"><h3 class="fw-bold">{% translate 'Request Approval' %}</h3><form method="post" action="{% url 'portal:request_ticket_approval' ticket.reference %}" class="glis-stack-3" hx-post="{% url 'portal:request_ticket_approval' ticket.reference %}" hx-swap="none" hx-indicator="find .htmx-indicator" data-ticket-action>{% csrf_token %}{{ approval_request_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Request Approval' %}</button><span class="htmx-indicator spinner-border spinner-border-sm" aria-hidden="true"></span><div class="alert alert-danger d-none mt-2" data-ticket-action-error role="alert"></div></form><div class="modal-footer"><button type="button" class="btn btn-sm" data-bs-dismiss="modal">{% translate 'Close' %}</button></div></div></div></div></div>
{% endif %}
