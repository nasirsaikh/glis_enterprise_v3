{% load i18n %}
{% if can_share %}
<dialog id="tagModal" class="modal"><div class="modal-box"><h3 class="font-bold">{% translate 'Tag Users' %}</h3><form method="post" action="{% url 'portal:tag_ticket_user' ticket.reference %}" class="space-y-3">{% csrf_token %}{{ participant_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Tag' %}</button></form><div class="modal-action"><button type="button" class="btn btn-sm" onclick="document.getElementById('tagModal').close()">{% translate 'Close' %}</button></div></div></dialog>
<dialog id="approvalRequestModal" class="modal"><div class="modal-box"><h3 class="font-bold">{% translate 'Request Approval' %}</h3><form method="post" action="{% url 'portal:request_ticket_approval' ticket.reference %}" class="space-y-3">{% csrf_token %}{{ approval_request_form.as_p }}<button class="btn btn-primary btn-sm" type="submit">{% translate 'Request Approval' %}</button></form><div class="modal-action"><button type="button" class="btn btn-sm" onclick="document.getElementById('approvalRequestModal').close()">{% translate 'Close' %}</button></div></div></dialog>
{% endif %}
