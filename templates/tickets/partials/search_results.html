{% load i18n %}{% if term %}<div class="search-result-panel">{% for ticket in tickets %}<a href="{% url 'portal:ticket_detail' ticket.reference %}"><i class="bi bi-ticket-perforated"></i><span><strong>{{ ticket.reference }}</strong><small>{{ ticket.subject }}</small></span><span class="status-chip status-{{ ticket.status }}">{{ ticket.get_status_display }}</span></a>{% empty %}<div class="search-empty">{% translate "No permitted tickets found." %}</div>{% endfor %}</div>{% endif %}
