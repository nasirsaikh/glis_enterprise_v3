{% load i18n %}{% if term %}<div class="search-result-panel">{% for ticket in tickets %}<a href="{% url 'portal:ticket_detail' ticket.reference %}"><i class="bi bi-ticket-perforated"></i><span><strong>{{ ticket.reference }}</strong><small>{{ ticket.subject }}</small></span><span class="tw:d-badge tw:d-badge-outline tw:d-badge-sm">{{ ticket.get_status_display }}</span></a>{% empty %}<div class="search-empty">{% translate "No permitted tickets found." %}</div>{% endfor %}</div>{% endif %}
