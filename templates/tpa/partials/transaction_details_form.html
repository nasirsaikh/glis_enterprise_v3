{% load i18n %}
<form id="endorsement-details-form" class="card border border-base-300 bg-base-100 shadow-sm" method="post" action="{% url 'tpa:transaction_edit_details' tx.reference %}" hx-post="{% url 'tpa:transaction_edit_details' tx.reference %}" hx-target="#endorsement-details-form" hx-swap="outerHTML" data-processing-form>
  {% csrf_token %}<div class="card-body p-5">{% include "components/form_errors.html" %}<div class="grid gap-4 md:grid-cols-2">{% for field in form %}<fieldset class="fieldset {% if field.name == 'remarks' %}md:col-span-2{% endif %}"><label class="fieldset-legend" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="text-xs opacity-60">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="text-xs text-error">{{ error }}</p>{% endfor %}</fieldset>{% endfor %}</div><div class="card-actions justify-end border-t border-base-300 pt-4"><a class="btn btn-ghost" href="{% url 'tpa:transaction_detail' tx.reference %}">{% translate "Cancel" %}</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i>{% translate "Save details" %}</button></div></div>
</form>
