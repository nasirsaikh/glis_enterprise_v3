{% load i18n %}
<form id="endorsement-details-form" class="card border border-body bg-body shadow-sm" method="post" action="{% url 'tpa:transaction_edit_details' tx.reference %}" hx-post="{% url 'tpa:transaction_edit_details' tx.reference %}" hx-target="#endorsement-details-form" hx-swap="outerHTML" data-processing-form>
  {% csrf_token %}<div class="card-body p-3">{% include "components/form_errors.html" %}<div class="d-grid gap-3 glis-grid-md-2">{% for field in form %}<fieldset class="glis-field {% if field.name == 'remarks' %}glis-span-md-2{% endif %}"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% if field.help_text %}<p class="glis-text-xs opacity-50">{{ field.help_text }}</p>{% endif %}{% for error in field.errors %}<p class="glis-text-xs text-danger">{{ error }}</p>{% endfor %}</fieldset>{% endfor %}</div><div class="d-flex justify-content-end gap-2 justify-content-end border-top border-body pt-3"><a class="btn btn-light" href="{% url 'tpa:transaction_detail' tx.reference %}">{% translate "Cancel" %}</a><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg"></i>{% translate "Save details" %}</button></div></div>
</form>
