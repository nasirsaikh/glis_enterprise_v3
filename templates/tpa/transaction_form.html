{% extends "base_portal.html" %}{% block content %}<div class="tw:mx-auto tw:max-w-3xl"><div class="tw:d-card tw:border tw:border-base-300 tw:bg-base-100 tw:shadow-xl"><div class="tw:d-card-body"><h1 class="tw:d-card-title tw:text-3xl">New TPA Transaction</h1><p class="tw:text-base-content/60">Start a policy enrollment or member lifecycle transaction.</p><form method="post" class="tw:mt-5 tw:space-y-4">{% csrf_token %}{% for field in form %}<label class="tw:d-form-control"><span class="tw:d-label-text tw:mb-1">{{ field.label }}</span>{{ field }}{% if field.errors %}<span class="tw:text-error tw:text-sm">{{ field.errors|striptags }}</span>{% endif %}</label>{% endfor %}<button class="tw:d-btn tw:d-btn-primary" type="submit">Create Transaction</button></form></div></div></div>{% endblock %}
